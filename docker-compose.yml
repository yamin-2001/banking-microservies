

services:

  postgres:

    image: postgres:16

    container_name: banking-postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: postgres

      POSTGRES_USER: banking_admin

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:

      - "127.0.0.1:5433:5432"

    volumes:

      - banking_pgdata:/var/lib/postgresql/data

      - ./postgres-init:/docker-entrypoint-initdb.d:ro

    networks:

      - banking-network

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U banking_admin -d postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

  redis:

    image: redis:7-alpine

    container_name: banking-redis

    restart: unless-stopped

    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no" ]

    environment:

      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:

      - "127.0.0.1:6379:6379"

    networks:

      - banking-network

    healthcheck:

      test: [ "CMD", "redis-cli", "ping" ]

      interval: 10s

      timeout: 5s

      retries: 5

volumes:

  banking_pgdata:

networks:

  banking-network:

    name: banking-network

 